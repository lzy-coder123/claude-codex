<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOL招募报名</title>
  <style>
    :root {
      --primary: #4a90d9;
      --primary-dark: #357abd;
      --text: #233044;
      --muted: #6d7887;
      --border: #dce4ef;
      --danger: #d83b42;
      --success: #197a46;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #e8f0fe 0%, #f3e8ff 100%);
    }
    .form-card {
      width: min(100%, 600px);
      margin: 0 auto;
      padding: 38px 42px 40px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(75, 94, 137, 0.16);
    }
    .form-header { margin-bottom: 30px; text-align: center; }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0.04em; }
    .form-header p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .form-group, fieldset { margin: 0 0 21px; }
    fieldset { min-width: 0; padding: 0; border: 0; }
    label, legend { display: block; margin-bottom: 8px; font-weight: 600; font-size: 15px; }
    .required { margin-left: 3px; color: var(--danger); }
    input[type="text"], input[type="tel"], input[type="email"], select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      padding: 12px 13px;
      color: var(--text);
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
      background: #fff;
    }
    textarea { min-height: 112px; resize: vertical; line-height: 1.55; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(74, 144, 217, .16);
    }
    .invalid { border-color: var(--danger) !important; }
    .option-list { display: flex; flex-wrap: wrap; gap: 10px 16px; }
    .option-list label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-weight: 400;
      cursor: pointer;
    }
    input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); width: 16px; height: 16px; }
    .error-message { display: none; margin: 7px 0 0; color: var(--danger); font-size: 13px; }
    .error-message.visible { display: block; }
    .notice {
      display: none;
      margin: 0 0 21px;
      padding: 12px 14px;
      border-radius: 9px;
      color: var(--success);
      background: #e9f8ef;
      font-size: 14px;
    }
    .notice.visible { display: block; }
    .notice.error { color: #b71c1c; background: #fdecea; }
    .button-row { display: flex; gap: 12px; margin-top: 30px; }
    button {
      flex: 1;
      min-height: 46px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .submit-button { color: #fff; background: var(--primary); }
    .submit-button:hover { background: var(--primary-dark); }
    .reset-button { color: #526173; background: #edf1f6; }
    .reset-button:hover { background: #dde4ec; }
    button:active { transform: translateY(1px); }
    @media (max-width: 560px) {
      body { padding: 24px 14px; }
      .form-card { padding: 30px 22px; border-radius: 16px; }
      h1 { font-size: 24px; }
      .option-list { gap: 10px 12px; }
    }
  </style>
</head>
<body>
  <main class="form-card">
    <header class="form-header">
      <h1>KOL招募报名</h1>
      <p>期待与有影响力的创作者一起合作</p>
    </header>

    <div id="successNotice" class="notice" role="status"></div>

    <iframe name="submitTarget" style="display:none"></iframe>

    <form id="recruitmentForm" novalidate
          action="https://chastity-reproduce-entrap.ngrok-free.dev/webhook/1c7325d4-61c3-4cc1-a311-67d6d40cb2e3"
          method="POST" target="submitTarget">

      <div class="form-group">
        <label for="name">真实姓名<span class="required">*</span></label>
        <input id="name" name="name" type="text" required />
        <p class="error-message" id="nameError"></p>
      </div>

      <div class="form-group">
        <label for="phone">手机号码<span class="required">*</span></label>
        <input id="phone" name="phone" type="tel" placeholder="请输入11位中国大陆手机号" required />
        <p class="error-message" id="phoneError"></p>
      </div>

      <div class="form-group">
        <label for="email">电子邮箱<span class="required">*</span></label>
        <input id="email" name="email" type="email" placeholder="name@example.com" required />
        <p class="error-message" id="emailError"></p>
      </div>

      <div class="form-group">
        <label for="platform">主要平台<span class="required">*</span></label>
        <select id="platform" name="platform" required>
          <option value="" selected disabled>请选择主要平台</option>
          <option>抖音</option><option>B站</option><option>小红书</option><option>微博</option><option>快手</option><option>YouTube</option><option>其他</option>
        </select>
        <p class="error-message" id="platformError"></p>
      </div>

      <div class="form-group">
        <label for="account">账号名称<span class="required">*</span></label>
        <input id="account" name="account" type="text" required />
        <p class="error-message" id="accountError"></p>
      </div>

      <div class="form-group">
        <label for="followers">粉丝数量级<span class="required">*</span></label>
        <select id="followers" name="followers" required>
          <option value="" selected disabled>请选择粉丝数量级</option>
          <option>1万以下</option><option>1-10万</option><option>10-50万</option><option>50-100万</option><option>100万以上</option>
        </select>
        <p class="error-message" id="followersError"></p>
      </div>

      <fieldset id="contentFieldset">
        <legend>内容领域<span class="required">*</span></legend>
        <div class="option-list">
          <label><input name="content" type="checkbox" value="美妆护肤" />美妆护肤</label><label><input name="content" type="checkbox" value="科技数码" />科技数码</label><label><input name="content" type="checkbox" value="美食探店" />美食探店</label><label><input name="content" type="checkbox" value="时尚穿搭" />时尚穿搭</label><label><input name="content" type="checkbox" value="母婴育儿" />母婴育儿</label><label><input name="content" type="checkbox" value="运动健身" />运动健身</label><label><input name="content" type="checkbox" value="知识教育" />知识教育</label><label><input name="content" type="checkbox" value="游戏电竞" />游戏电竞</label><label><input name="content" type="checkbox" value="旅游出行" />旅游出行</label><label><input name="content" type="checkbox" value="其他" />其他</label>
        </div>
        <p class="error-message" id="contentError"></p>
      </fieldset>

      <fieldset id="cooperationFieldset">
        <legend>合作意向<span class="required">*</span></legend>
        <div class="option-list">
          <label><input name="cooperation" type="radio" value="产品推广" />产品推广</label><label><input name="cooperation" type="radio" value="品牌代言" />品牌代言</label><label><input name="cooperation" type="radio" value="直播带货" />直播带货</label><label><input name="cooperation" type="radio" value="内容共创" />内容共创</label><label><input name="cooperation" type="radio" value="多种合作" />多种合作</label>
        </div>
        <p class="error-message" id="cooperationError"></p>
      </fieldset>

      <div class="form-group">
        <label for="introduction">自我介绍/合作经验<span class="required">*</span></label>
        <textarea id="introduction" name="introduction" required placeholder="请简要介绍您的内容特点、受众及过往合作经验"></textarea>
        <p class="error-message" id="introductionError"></p>
      </div>

      <div class="button-row">
        <button class="submit-button" type="submit">提交报名</button>
        <button class="reset-button" type="reset">重置</button>
      </div>
    </form>
  </main>

  <script>
    var form = document.getElementById('recruitmentForm');
    var notice = document.getElementById('successNotice');
    var phoneRE = /^1[3-9]\d{9}$/;
    var emailRE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function showError(id, msg, el) {
      var e = document.getElementById(id + 'Error');
      if (e) { e.textContent = msg; e.classList.toggle('visible', !!msg); }
      if (el) el.classList.toggle('invalid', !!msg);
      return !msg;
    }

    function validateText(id, label) {
      var el = document.getElementById(id);
      return showError(id, el.value.trim() ? '' : '请填写' + label, el);
    }

    function validateForm() {
      var ph = document.getElementById('phone');
      var em = document.getElementById('email');
      var ct = document.querySelectorAll('input[name="content"]:checked').length > 0;
      var cp = document.querySelector('input[name="cooperation"]:checked');
      return [
        validateText('name', '真实姓名'),
        showError('phone', !ph.value.trim() ? '请填写手机号码' : phoneRE.test(ph.value.trim()) ? '' : '请输入正确的中国大陆手机号', ph),
        showError('email', !em.value.trim() ? '请填写电子邮箱' : emailRE.test(em.value.trim()) ? '' : '请输入正确的邮箱格式', em),
        validateText('platform', '主要平台'),
        validateText('account', '账号名称'),
        validateText('followers', '粉丝数量级'),
        showError('content', ct ? '' : '请至少选择一个内容领域'),
        showError('cooperation', cp ? '' : '请选择合作意向'),
        validateText('introduction', '自我介绍/合作经验')
      ].every(function(v) { return v; });
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      notice.classList.remove('visible', 'error');
      if (!validateForm()) return;

      // 用 fetch 发数据（加 ngrok 头以绕过警告页）
      var fd = new FormData(form);
      var params = new URLSearchParams(fd).toString();
      fetch(form.action, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'ngrok-skip-browser-warning': '1'
        },
        body: params
      });

      // 立刻显示成功
      notice.textContent = '报名提交成功，我们会尽快与您联系！';
      notice.classList.add('visible');
      form.reset();
      setTimeout(function() { notice.classList.remove('visible'); }, 3000);
    });

    // 输入时清除错误提示
    form.addEventListener('input', function(e) {
      if (!e.target.matches('input, textarea, select')) return;
      var err = document.getElementById(e.target.id + 'Error');
      if (err) err.classList.remove('visible');
      e.target.classList.remove('invalid');
    });
    form.addEventListener('change', function(e) {
      if (!e.target.matches('input, textarea, select')) return;
      var err = document.getElementById(e.target.id + 'Error');
      if (err) err.classList.remove('visible');
      e.target.classList.remove('invalid');
      if (e.target.name === 'content') { var ce = document.getElementById('contentError'); if (ce) ce.classList.remove('visible'); }
      if (e.target.name === 'cooperation') { var ce = document.getElementById('cooperationError'); if (ce) ce.classList.remove('visible'); }
    });

    // 重置按钮
    form.addEventListener('reset', function() {
      notice.classList.remove('visible', 'error');
      [].forEach.call(document.querySelectorAll('.error-message'), function(e) { e.classList.remove('visible'); });
      [].forEach.call(document.querySelectorAll('.invalid'), function(e) { e.classList.remove('invalid'); });
    });
  </script>
</body>
</html>
